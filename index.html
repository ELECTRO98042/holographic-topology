<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holographic Topology Simulator</title>
    <style>
        body {
            margin: 0;
            background-color: #0b0f19;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            user-select: none;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 15px 20px;
            border-radius: 8px;
            pointer-events: none;
            backdrop-filter: blur(8px);
        }
        h1 {
            font-size: 1.1rem;
            margin: 0 0 5px 0;
            color: #38bdf8;
            letter-spacing: 0.05em;
        }
        p {
            margin: 0 0 5px 0;
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .metric {
            color: #38bdf8;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="hud">
        <h1>Holographic Topology Field</h1>
        <p><strong>Left Click:</strong> Inject Peripheral Node</p>
        <p><strong>Right Click Node:</strong> Sever Node (Fault Event + Healing Pulse)</p>
        <p>Network Integrity: <span id="integrityMetric" class="metric">100%</span></p>
    </div>

    <div id="canvas-container">
        <canvas id="simCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        class Pulse {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 10;
                this.maxRadius = 250;
                this.alpha = 0.8;
            }

            update() {
                this.radius += 4;
                this.alpha -= 0.015;
            }

            draw() {
                if (this.alpha <= 0) return;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.strokeStyle = `rgba(56, 189, 248, ${this.alpha})`;
                ctx.lineWidth = 2;
                ctx.stroke();
            }
        }

        class Node {
            constructor(x, y, isCore = false) {
                this.x = x;
                this.y = y;
                this.isCore = isCore;
                this.vx = (Math.random() - 0.5) * (isCore ? 0.3 : 0.8);
                this.vy = (Math.random() - 0.5) * (isCore ? 0.3 : 0.8);
                this.radius = isCore ? 8 : 4;
                this.health = 1.0; 
                this.isSevered = false;
                this.pulseEffect = 0;
            }

            update() {
                if (this.isSevered) {
                    this.health -= 0.02;
                    return;
                }

                if (this.pulseEffect > 0) {
                    this.pulseEffect -= 0.03;
                }

                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 50 || this.x > width - 50) this.vx *= -1;
                if (this.y < 50 || this.y > height - 50) this.vy *= -1;
            }

            draw() {
                if (this.health <= 0) return;

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                
                if (this.isSevered) {
                    ctx.fillStyle = `rgba(239, 68, 68, ${this.health})`; 
                    ctx.shadowColor = '#ef4444';
                } else if (this.pulseEffect > 0) {
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowColor = '#38bdf8';
                } else {
                    ctx.fillStyle = this.isCore ? '#0284c7' : '#38bdf8';
                    ctx.shadowColor = '#38bdf8';
                }

                ctx.shadowBlur = (this.isCore ? 15 : 8) + (this.pulseEffect * 15);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        const nodes = [];
        const pulses = [];
        const initialNodes = 30;
        const initialCores = 5;

        // Seed Core Bulk Anchors
        for (let i = 0; i < initialCores; i++) {
            nodes.push(new Node(
                Math.random() * (width - 200) + 100, 
                Math.random() * (height - 200) + 100, 
                true
            ));
        }

        // Seed Peripheral Boundary Nodes
        for (let i = 0; i < initialNodes; i++) {
            nodes.push(new Node(
                Math.random() * (width - 100) + 50, 
                Math.random() * (height - 100) + 50, 
                false
            ));
        }

        window.addEventListener('click', (e) => {
            if (e.clientX < 280 && e.clientY < 140) return;
            nodes.push(new Node(e.clientX, e.clientY, false));
            if (nodes.length > 70) nodes.shift();
        });

        window.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            let closest = null;
            let minDist = Infinity;

            nodes.forEach(node => {
                const dist = Math.hypot(node.x - e.clientX, node.y - e.clientY);
                if (dist < minDist) {
                    minDist = dist;
                    closest = node;
                }
            });

            if (closest && minDist < 45) {
                closest.isSevered = true;
                pulses.push(new Pulse(closest.x, closest.y));
            }
        });

        function animate() {
            ctx.fillStyle = 'rgba(11, 15, 25, 0.25)';
            ctx.fillRect(0, 0, width, height);

            for (let i = pulses.length - 1; i >= 0; i--) {
                pulses[i].update();
                pulses[i].draw();

                nodes.forEach(node => {
                    if (!node.isSevered) {
                        const dist = Math.hypot(node.x - pulses[i].x, node.y - pulses[i].y);
                        if (Math.abs(dist - pulses[i].radius) < 15) {
                            node.pulseEffect = 1.0;
                        }
                    }
                });

                if (pulses[i].alpha <= 0) {
                    pulses.splice(i, 1);
                }
            }

            for (let i = nodes.length - 1; i >= 0; i--) {
                nodes[i].update();
                if (nodes[i].health <= 0) {
                    nodes.splice(i, 1);
                }
            }

            const maxDistance = 160;
            for (let i = 0; i < nodes.length; i++) {
                nodes[i].draw();
                for (let j = i + 1; j < nodes.length; j++) {
                    if (nodes[i].isSevered || nodes[j].isSevered) continue;

                    const dx = nodes[i].x - nodes[j].x;
                    const dy = nodes[i].y - nodes[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < maxDistance) {
                        const factor = 1 - (dist / maxDistance);
                        const isCoreBond = nodes[i].isCore && nodes[j].isCore;
                        const weightMultiplier = isCoreBond ? 1.5 : 1.0;
                        const alpha = (Math.pow(factor, 1.5) * weightMultiplier).toFixed(2);

                        ctx.beginPath();
                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        ctx.lineTo(nodes[j].x, nodes[j].y);
                        ctx.strokeStyle = isCoreBond ? `rgba(2, 132, 199, ${alpha * 0.7})` : `rgba(56, 189, 248, ${alpha * 0.4})`;
                        ctx.lineWidth = factor * (isCoreBond ? 3 : 1.5);
                        ctx.stroke();
                    }
                }
            }

            const totalActiveInitial = initialNodes + initialCores;
            const currentActive = nodes.filter(n => !n.isSevered).length;
            const integrity = totalActiveInitial > 0 ? Math.round((currentActive / totalActiveInitial) * 100) : 0;
            document.getElementById('integrityMetric').innerText = `${Math.min(integrity, 100)}%`;

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
