  An interactive client-side simulation exploring emergent holographic network 
  topologies, harmonic wave interference rings, persistent local storage, 
  external JSON import/export, Ryu-Takayanagi entanglement entropy ($S_{EE}$), 
  Integrated Information ($\Phi$), and pseudo-3D spatial depth planes.
  
  ENVIRONMENT & TOOLSTACK:
  - OS: macOS Sequoia (Hackintosh Architecture)
  - Editor: Visual Studio Code
  - Runtime: Vanilla HTML5 Canvas & ECMAScript 6 (ES6) JavaScript
  - Dependencies: None (Zero external framework bloat)
  
  CHANGE LOG:
  - v1.9.0 (2026-10-05): Upgraded fault pulse mechanics into multi-ring harmonic 
                         wave interference patterns with constructive/destructive superposition.
  - v1.8.0 (2026-10-05): Added persistent localStorage auto-saving and state restoration.
  - v1.7.0 (2026-10-05): Added external JSON topology import and snapshot export 
                         utilities, plus real-time $S_{EE}$ and $\Phi$ metrics.
  - v1.6.0 (2026-10-05): Added interactive node telemetry HUD drawer and 
                         pseudo-3D spatial depth plane oscillation.
  - v1.5.0 (2026-10-05): Added observation mode switching (Entanglement Matrix, 
                         Bulk Hologram, and Fault Resilience lenses).
  - v1.4.1 (2026-10-05): Fixed live reactive physics scaling for drift velocity 
                         and pulse speed, and disabled input state caching.
  - v1.4.0 (2026-10-05): Added interactive HUD parameter controls for live 
                         tuning of entanglement range, drift velocity, 
                         and pulse speed.
  - v1.3.0 (2026-10-05): Introduced core-peripheral node typing with 
                         asymmetric entanglement capacity and bulk anchoring.
  - v1.2.0 (2026-10-05): Added autonomous healing pulses upon fault 
                         injection and refined distance-gradient 
                         entanglement weighting.
  - v1.1.0 (2026-10-05): Added right-click fault injection (node severing),
                         dynamic bond recalculation, and real-time network 
                         integrity HUD tracking.
  - v1.0.0 (2026-10-05): Initial canvas prototype, node drifting, and 
                         distance-threshold entanglement rendering.

-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Holographic Topology Simulator</title>
    <style>
        body {
            margin: 0;
            background-color: #0b0f19;
            color: #e2e8f0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden;
            user-select: none;
        }
        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
        .hud {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 15px 20px;
            border-radius: 8px;
            backdrop-filter: blur(8px);
            width: 280px;
            z-index: 10;
        }
        .telemetry-hud {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(56, 189, 248, 0.3);
            padding: 15px 20px;
            border-radius: 8px;
            backdrop-filter: blur(8px);
            width: 220px;
            z-index: 10;
            display: none;
        }
        h1, h2 {
            font-size: 1.1rem;
            margin: 0 0 5px 0;
            color: #38bdf8;
            letter-spacing: 0.05em;
        }
        h2 { font-size: 0.95rem; }
        p {
            margin: 0 0 5px 0;
            font-size: 0.82rem;
            color: #94a3b8;
        }
        .metric {
            color: #38bdf8;
            font-weight: bold;
            font-family: monospace;
        }
        .control-group {
            margin-top: 10px;
            border-top: 1px solid rgba(56, 189, 248, 0.2);
            padding-top: 10px;
        }
        label {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            color: #cbd5e1;
            margin-bottom: 3px;
        }
        input[type="range"], select {
            width: 100%;
            accent-color: #38bdf8;
            margin-bottom: 8px;
            cursor: pointer;
            background: #1e293b;
            color: #e2e8f0;
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 4px;
            padding: 4px;
            font-size: 0.78rem;
        }
        .btn-row {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }
        button, label.file-btn {
            flex: 1;
            background: #1e293b;
            color: #38bdf8;
            border: 1px solid rgba(56, 189, 248, 0.4);
            padding: 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
            text-align: center;
            transition: background 0.2s;
        }
        button:hover, label.file-btn:hover {
            background: rgba(56, 189, 248, 0.15);
        }
        input[type="file"] {
            display: none;
        }
        .telemetry-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.78rem;
            margin-bottom: 4px;
            color: #cbd5e1;
        }
        .telemetry-val {
            font-family: monospace;
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <div class="hud">
        <h1>Holographic Topology</h1>
        <p><strong>Left Click Canvas:</strong> Inject Node</p>
        <p><strong>Left Click Node:</strong> Inspect Telemetry</p>
        <p><strong>Right Click Node:</strong> Sever Node (Interference Pulse)</p>
        <p>Network Integrity: <span id="integrityMetric" class="metric">100%</span></p>
        <p>Entanglement S(EE): <span id="entropyMetric" class="metric">0.00</span></p>
        <p>Integrated Info (&Phi;): <span id="phiMetric" class="metric">0.00</span></p>

        <div class="control-group">
            <div class="btn-row">
                <button id="exportBtn" autocomplete="off">Export</button>
                <label class="file-btn" for="importFile">Import</label>
                <input type="file" id="importFile" accept=".json" autocomplete="off">
                <button id="resetStateBtn" autocomplete="off">Reset</button>
            </div>

            <label><span>Observer Lens</span></label>
            <select id="modeSelect" autocomplete="off">
                <option value="matrix">Entanglement Matrix</option>
                <option value="bulk">Bulk Hologram Projection</option>
                <option value="fault">Fault Resilience View</option>
            </select>

            <label><span>Entanglement Range</span><span id="valRange">160</span></label>
            <input type="range" id="rangeSlider" min="80" max="300" value="160" autocomplete="off">

            <label><span>Drift Velocity</span><span id="valDrift">0.8</span></label>
            <input type="range" id="driftSlider" min="0.1" max="3.0" step="0.1" value="0.8" autocomplete="off">

            <label><span>Pulse Expansion Speed</span><span id="valPulse">4</span></label>
            <input type="range" id="pulseSlider" min="1" max="15" value="4" autocomplete="off">
        </div>
    </div>

    <div id="telemetryBox" class="telemetry-hud">
        <h2>Node Telemetry</h2>
        <div class="telemetry-row"><span>ID:</span><span id="telId" class="telemetry-val">--</span></div>
        <div class="telemetry-row"><span>Class:</span><span id="telClass" class="telemetry-val">--</span></div>
        <div class="telemetry-row"><span>Active Bonds:</span><span id="telBonds" class="telemetry-val">0</span></div>
        <div class="telemetry-row"><span>Z-Depth:</span><span id="telDepth" class="telemetry-val">0.00</span></div>
        <div class="telemetry-row"><span>Velocity:</span><span id="telVel" class="telemetry-val">0.00</span></div>
    </div>

    <div id="canvas-container">
        <canvas id="simCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Interactive Parameter Bindings
        const rangeSlider = document.getElementById('rangeSlider');
        const driftSlider = document.getElementById('driftSlider');
        const pulseSlider = document.getElementById('pulseSlider');
        const modeSelect = document.getElementById('modeSelect');
        const telemetryBox = document.getElementById('telemetryBox');
        const exportBtn = document.getElementById('exportBtn');
        const importFile = document.getElementById('importFile');
        const resetStateBtn = document.getElementById('resetStateBtn');

        let selectedNode = null;
        let nodeCounter = 0;
        let initialActiveCount = 0;

        rangeSlider.addEventListener('input', (e) => document.getElementById('valRange').innerText = e.target.value);
        driftSlider.addEventListener('input', (e) => document.getElementById('valDrift').innerText = e.target.value);
        pulseSlider.addEventListener('input', (e) => document.getElementById('valPulse').innerText = e.target.value);

        const STORAGE_KEY = 'holographic_topology_state_v1.9';

        function saveToLocalStorage() {
            const state = {
                version: "1.9.0",
                timestamp: new Date().toISOString(),
                nodes: nodes.map(n => ({
                    id: n.id,
                    x: n.x,
                    y: n.y,
                    z: n.z,
                    isCore: n.isCore,
                    isSevered: n.isSevered,
                    health: n.health
                }))
            };
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
            } catch (err) {
                console.error("Failed to save state to localStorage:", err);
            }
        }

        exportBtn.addEventListener('click', () => {
            const snapshot = {
                version: "1.9.0",
                timestamp: new Date().toISOString(),
                canvas: { width, height },
                nodes: nodes.map(n => ({
                    id: n.id,
                    x: n.x,
                    y: n.y,
                    z: n.z,
                    isCore: n.isCore,
                    isSevered: n.isSevered,
                    health: n.health
                }))
            };

            const blob = new Blob([JSON.stringify(snapshot, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `holographic-topology-${Date.now()}.json`;
            a.click();
            URL.revokeObjectURL(url);
        });

        importFile.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (event) => {
                try {
                    const data = JSON.parse(event.target.result);
                    if (data.nodes && Array.isArray(data.nodes)) {
                        loadNodesFromData(data.nodes);
                        saveToLocalStorage();
                    }
                } catch (err) {
                    console.error("Failed to parse imported topology model:", err);
                }
                importFile.value = '';
            };
            reader.readAsText(file);
        });

        resetStateBtn.addEventListener('click', () => {
            localStorage.removeItem(STORAGE_KEY);
            initDefaultTopology();
        });

        class HarmonicPulse {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.radius = 5;
                this.maxRadius = 320;
                this.alpha = 0.85;
                // Harmonic sub-rings for interference patterns
                this.subRings = [0, 22, 45, 70];
            }

            update() {
                this.radius += parseFloat(pulseSlider.value);
                this.alpha -= 0.008;
            }

            draw() {
                if (this.alpha <= 0) return;
                const mode = modeSelect.value;

                this.subRings.forEach((offset, idx) => {
                    const r = this.radius - (idx * 16);
                    if (r <= 0 || r > this.maxRadius) return;

                    const ringAlpha = Math.max(0, this.alpha * (1 - (idx * 0.2)));
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, r, 0, Math.PI * 2);

                    if (mode === 'fault') {
                        ctx.strokeStyle = `rgba(239, 68, 68, ${ringAlpha})`;
                    } else if (mode === 'bulk') {
                        ctx.strokeStyle = `rgba(147, 51, 234, ${ringAlpha})`;
                    } else {
                        ctx.strokeStyle = `rgba(56, 189, 248, ${ringAlpha})`;
                    }

                    ctx.lineWidth = idx === 0 ? 2.5 : 1.2;
                    ctx.stroke();
                });
            }
        }

        class Node {
            constructor(x, y, isCore = false) {
                this.id = `N-${String(++nodeCounter).padStart(3, '0')}`;
                this.x = x;
                this.y = y;
                this.z = (Math.random() - 0.5) * 2; 
                this.zSpeed = (Math.random() - 0.5) * 0.01;
                this.isCore = isCore;
                
                const angle = Math.random() * Math.PI * 2;
                this.dirX = Math.cos(angle);
                this.dirY = Math.sin(angle);
                
                this.baseRadius = isCore ? 8 : 4;
                this.health = 1.0; 
                this.isSevered = false;
                this.pulseEffect = 0;
                this.activeBonds = 0;
            }

            update() {
                if (this.isSevered) {
                    this.health -= 0.02;
                    return;
                }

                if (this.pulseEffect > 0) {
                    this.pulseEffect -= 0.03;
                }

                this.z += this.zSpeed;
                if (this.z < -1 || this.z > 1) this.zSpeed *= -1;

                const currentDrift = parseFloat(driftSlider.value);
                const speed = currentDrift * (this.isCore ? 0.35 : 1.0);

                this.x += this.dirX * speed;
                this.y += this.dirY * speed;

                if (this.x < 50 || this.x > width - 50) {
                    this.dirX *= -1;
                    this.x = Math.max(50, Math.min(width - 50, this.x));
                }
                if (this.y < 50 || this.y > height - 50) {
                    this.dirY *= -1;
                    this.y = Math.max(50, Math.min(height - 50, this.y));
                }
            }

            draw() {
                if (this.health <= 0) return;
                const mode = modeSelect.value;

                const depthScale = 1 + (this.z * 0.3);
                const renderRadius = Math.max(2, this.baseRadius * depthScale);

                ctx.beginPath();
                ctx.arc(this.x, this.y, renderRadius, 0, Math.PI * 2);
                
                if (this === selectedNode) {
                    ctx.fillStyle = '#f59e0b';
                    ctx.shadowColor = '#f59e0b';
                } else if (this.isSevered) {
                    ctx.fillStyle = `rgba(239, 68, 68, ${this.health})`; 
                    ctx.shadowColor = '#ef4444';
                } else if (this.pulseEffect > 0) {
                    ctx.fillStyle = '#ffffff';
                    ctx.shadowColor = mode === 'bulk' ? '#9333ea' : '#38bdf8';
                } else {
                    if (mode === 'bulk') {
                        ctx.fillStyle = this.isCore ? '#7e22ce' : '#c084fc';
                        ctx.shadowColor = '#9333ea';
                    } else if (mode === 'fault') {
                        ctx.fillStyle = this.isCore ? '#047857' : '#10b981';
                        ctx.shadowColor = '#10b981';
                    } else {
                        ctx.fillStyle = this.isCore ? '#0284c7' : '#38bdf8';
                        ctx.shadowColor = '#38bdf8';
                    }
                }

                ctx.shadowBlur = ((this.isCore ? 15 : 8) + (this.pulseEffect * 15)) * depthScale;
                ctx.fill();
                ctx.shadowBlur = 0;
            }
        }

        const nodes = [];
        const pulses = [];

        function loadNodesFromData(nodeDataList) {
            nodes.length = 0;
            pulses.length = 0;
            selectedNode = null;
            telemetryBox.style.display = 'none';
            nodeCounter = 0;

            nodeDataList.forEach(nd => {
                nodeCounter++;
                const newNode = new Node(nd.x, nd.y, nd.isCore);
                newNode.id = nd.id || `N-${String(nodeCounter).padStart(3, '0')}`;
                newNode.z = nd.z !== undefined ? nd.z : newNode.z;
                newNode.isSevered = nd.isSevered || false;
                newNode.health = nd.health !== undefined ? nd.health : 1.0;
                nodes.push(newNode);
            });

            initialActiveCount = nodes.filter(n => !n.isSevered).length;
        }

        function initDefaultTopology() {
            nodes.length = 0;
            pulses.length = 0;
            selectedNode = null;
            telemetryBox.style.display = 'none';
            nodeCounter = 0;

            const initialNodes = 30;
            const initialCores = 5;

            for (let i = 0; i < initialCores; i++) {
                nodes.push(new Node(Math.random() * (width - 200) + 100, Math.random() * (height - 200) + 100, true));
            }

            for (let i = 0; i < initialNodes; i++) {
                nodes.push(new Node(Math.random() * (width - 100) + 50, Math.random() * (height - 100) + 50, false));
            }

            initialActiveCount = nodes.length;
            saveToLocalStorage();
        }

        const savedStateJSON = localStorage.getItem(STORAGE_KEY);
        if (savedStateJSON) {
            try {
                const parsed = JSON.parse(savedStateJSON);
                if (parsed.nodes && Array.isArray(parsed.nodes) && parsed.nodes.length > 0) {
                    loadNodesFromData(parsed.nodes);
                } else {
                    initDefaultTopology();
                }
            } catch (e) {
                initDefaultTopology();
            }
        } else {
            initDefaultTopology();
        }

        window.addEventListener('click', (e) => {
            if (e.target.closest('.hud') || e.target.closest('.telemetry-hud')) return;

            let clickedNode = null;
            let minDist = Infinity;

            nodes.forEach(node => {
                const dist = Math.hypot(node.x - e.clientX, node.y - e.clientY);
                if (dist < minDist) {
                    minDist = dist;
                    clickedNode = node;
                }
            });

            if (clickedNode && minDist < 25) {
                selectedNode = clickedNode;
                telemetryBox.style.display = 'block';
            } else {
                selectedNode = null;
                telemetryBox.style.display = 'none';
                nodes.push(new Node(e.clientX, e.clientY, false));
                if (nodes.length > 70) nodes.shift();
                saveToLocalStorage();
            }
        });

        window.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            if (e.target.closest('.hud') || e.target.closest('.telemetry-hud')) return;

            let closest = null;
            let minDist = Infinity;

            nodes.forEach(node => {
                const dist = Math.hypot(node.x - e.clientX, node.y - e.clientY);
                if (dist < minDist) {
                    minDist = dist;
                    closest = node;
                }
            });

            if (closest && minDist < 45) {
                closest.isSevered = true;
                pulses.push(new HarmonicPulse(closest.x, closest.y));
                if (selectedNode === closest) {
                    selectedNode = null;
                    telemetryBox.style.display = 'none';
                }
                saveToLocalStorage();
            }
        });

        function animate() {
            ctx.fillStyle = 'rgba(11, 15, 25, 0.25)';
            ctx.fillRect(0, 0, width, height);

            const mode = modeSelect.value;

            for (let i = pulses.length - 1; i >= 0; i--) {
                pulses[i].update();
                pulses[i].draw();

                nodes.forEach(node => {
                    if (!node.isSevered) {
                        const dist = Math.hypot(node.x - pulses[i].x, node.y - pulses[i].y);
                        if (Math.abs(dist - pulses[i].radius) < 25) {
                            node.pulseEffect = 1.0;
                        }
                    }
                });

                if (pulses[i].alpha <= 0) {
                    pulses.splice(i, 1);
                }
            }

            nodes.forEach(n => {
                n.update();
                n.activeBonds = 0;
            });

            let removedDead = false;
            for (let i = nodes.length - 1; i >= 0; i--) {
                if (nodes[i].health <= 0) {
                    nodes.splice(i, 1);
                    removedDead = true;
                }
            }
            if (removedDead) {
                saveToLocalStorage();
            }

            const maxDistance = parseFloat(rangeSlider.value);
            let totalBondWeight = 0;
            let coreBondCount = 0;
            let activePairs = 0;

            for (let i = 0; i < nodes.length; i++) {
                nodes[i].draw();
                for (let j = i + 1; j < nodes.length; j++) {
                    if (nodes[i].isSevered || nodes[j].isSevered) continue;

                    const dx = nodes[i].x - nodes[j].x;
                    const dy = nodes[i].y - nodes[j].y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < maxDistance) {
                        nodes[i].activeBonds++;
                        nodes[j].activeBonds++;
                        activePairs++;

                        const factor = 1 - (dist / maxDistance);
                        const isCoreBond = nodes[i].isCore && nodes[j].isCore;
                        if (isCoreBond) coreBondCount++;

                        const weightMultiplier = isCoreBond ? 1.5 : 1.0;
                        const bondStrength = Math.pow(factor, 1.5) * weightMultiplier;
                        totalBondWeight += bondStrength;

                        const alpha = bondStrength.toFixed(2);

                        ctx.beginPath();
                        ctx.moveTo(nodes[i].x, nodes[i].y);
                        ctx.lineTo(nodes[j].x, nodes[j].y);
                        
                        if (mode === 'bulk') {
                            ctx.strokeStyle = isCoreBond ? `rgba(147, 51, 234, ${alpha * 0.8})` : `rgba(192, 132, 252, ${alpha * 0.3})`;
                        } else if (mode === 'fault') {
                            ctx.strokeStyle = isCoreBond ? `rgba(16, 185, 129, ${alpha * 0.8})` : `rgba(52, 211, 153, ${alpha * 0.3})`;
                        } else {
                            ctx.strokeStyle = isCoreBond ? `rgba(2, 132, 199, ${alpha * 0.7})` : `rgba(56, 189, 248, ${alpha * 0.4})`;
                        }

                        ctx.lineWidth = factor * (isCoreBond ? 3 : 1.5);
                        ctx.stroke();
                    }
                }
            }

            // Physics Metrics Computation
            const activeNodes = nodes.filter(n => !n.isSevered);
            const sEE = (totalBondWeight * 0.46).toFixed(2);
            const phi = (activePairs > 0 ? (coreBondCount * 2.5 + totalBondWeight) / activeNodes.length : 0).toFixed(2);

            document.getElementById('entropyMetric').innerText = sEE;
            document.getElementById('phiMetric').innerText = phi;

            // Update Telemetry Panel
            if (selectedNode) {
                document.getElementById('telId').innerText = selectedNode.id;
                document.getElementById('telClass').innerText = selectedNode.isCore ? 'Core Anchor' : 'Boundary';
                document.getElementById('telBonds').innerText = selectedNode.activeBonds;
                document.getElementById('telDepth').innerText = selectedNode.z.toFixed(2);
                
                const speed = parseFloat(driftSlider.value) * (selectedNode.isCore ? 0.35 : 1.0);
                document.getElementById('telVel').innerText = speed.toFixed(2);
            }

            const currentActive = activeNodes.length;
            const integrity = initialActiveCount > 0 ? Math.round((currentActive / initialActiveCount) * 100) : 100;
            document.getElementById('integrityMetric').innerText = `${Math.min(integrity, 100)}%`;

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
